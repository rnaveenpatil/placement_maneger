name: placement_player
description: A comprehensive Campus Placements Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Utilities - Using intl 0.19.0 for compatibility
  cupertino_icons: ^1.0.6
  intl: ^0.20.2  # Downgraded from 0.20.0 for compatibility
  uuid: ^4.3.3
  equatable: ^2.0.5
  
  # State Management
  provider: ^6.1.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  
  # Network & API
  http: ^1.2.0
  dio: ^5.4.1
  retrofit: ^4.0.3
  logger: ^2.1.0
  connectivity_plus: ^7.0.0
  
  # Authentication
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0
  
  # Image & File Handling
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.1.0
  
  # PDF Viewing & Generation
  flutter_pdfview: ^1.3.3
  pdf: ^3.10.8
  printing: ^5.11.1
  
  # Charts & Analytics - Using older version compatible with intl 0.19.0
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.2.7  # Downgraded to compatible version
  
  # Notifications
  flutter_local_notifications: ^20.1.0
  firebase_messaging: ^16.1.1
  
  # Forms & Validation
  email_validator: ^3.0.0
  flutter_form_builder: ^10.3.0+2  # Works with intl 0.19.0
  form_builder_validators: ^11.3.0
  
  # UI Components
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  shimmer: ^3.0.0
  carousel_slider: ^5.1.2
  badges: ^3.1.2
  animate_do: ^4.2.0
  flutter_staggered_animations: ^1.1.0
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.14.4
  
  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^14.0.2
  
  # URL & Deep Linking
  url_launcher: ^6.2.6
  uni_links: ^0.5.1
  
  # QR Code
  qr_flutter: ^4.1.0
 # mobile_scanner: ^3.6.0
  
  # Date & Time
  table_calendar: ^3.1.0
  
  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.1
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Device Info
  device_info_plus: ^12.3.0
  
  # Package Info
  package_info_plus: ^9.0.0
  
  # Animation
  flutter_animate: ^4.5.0
  
  # Rating & Feedback
  flutter_rating_bar: ^4.0.1
  
  # Search & Filter
  flutter_typeahead: ^5.1.0
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0
  
  # Image Gallery
  photo_view: ^0.15.0
  
  # Video Player
  video_player: ^2.8.6
  chewie: ^1.7.5
  
  # Social Sharing
  share_plus: ^12.0.1
  
  # Biometric Authentication
  local_auth: ^3.0.1
  
  # CSV Export/Import
  csv: ^7.1.0
  
  # Excel Export/Import
  excel: ^4.0.0
  
  # Encrypted Storage
  encrypted_shared_preferences: ^3.0.1
  
  # Background Tasks
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.0.5
  
  # In-App Review
  in_app_review: ^2.0.8  # Using older version for compatibility
  
  # In-App WebView
  flutter_inappwebview: ^6.0.0
  
  # Firebase Services
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.4
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.1
  
  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
 
  


flutter_launcher_icons:
  android: true
  ios: true
 # image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#667eea"

flutter_native_splash:
  color: "#667eea"
  #image: assets/images/splash_logo.png
  android: true
  ios: true